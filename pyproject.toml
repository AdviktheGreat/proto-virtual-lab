[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "proto-virtual-lab"
version = "0.1.0"
description = "Typed scientific decision and control layer for Proto"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.116,<1",
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.10,<3",
    "proto-language @ git+https://github.com/evo-design/proto-language.git@edf64afbcf84cc7c5e4e1404418c8ef1f16c34ce",
    "proto-tools @ git+https://github.com/evo-design/proto-tools.git@1e0bd8f5a8f4525eb5e5c736cbf25c1366929e73",
    "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1",
    "mypy>=1.17,<2",
    "pytest>=8.4,<9",
    "pytest-cov>=6.2,<7",
    "ruff>=0.12,<1",
]

[project.scripts]
proto-virtual-lab = "proto_virtual_lab.main:run"

[tool.hatch.build.targets.wheel]
packages = ["src/proto_virtual_lab"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv]
override-dependencies = [
    "proto-tools @ git+https://github.com/evo-design/proto-tools.git@1e0bd8f5a8f4525eb5e5c736cbf25c1366929e73",
]

[tool.pytest.ini_options]
addopts = ["-ra", "--strict-config", "--strict-markers"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
packages = ["proto_virtual_lab"]

[tool.coverage.run]
branch = true
source = ["proto_virtual_lab"]

[tool.coverage.report]
show_missing = true
fail_under = 90
